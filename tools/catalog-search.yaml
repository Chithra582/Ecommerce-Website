name: catalog-search
description: Search the multi-vendor catalog with semantic typo tolerance and faceted filtering
version: 1.0.0
input_schema:
  type: object
  properties:
    query:
      type: string
      description: Search term or keyword phrase
    category:
      type: string
      description: Filter by product category (e.g., Electronics, Fashion, Home)
    min_price:
      type: number
      description: Minimum price threshold
    max_price:
      type: number
      description: Maximum price threshold
    min_rating:
      type: number
      description: Minimum star rating filter (1.0 to 5.0)
  required: [query]
output_schema:
  type: object
  properties:
    results:
      type: array
      items:
        type: object
    total_found:
      type: integer
annotations:
  read_only: true
  requires_confirmation: false
